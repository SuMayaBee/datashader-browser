[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datashader-browser"
version = "0.1.0a0"
description = "Bounded-memory Datashader pipelines for Python running in the browser"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{ name = "Sumaiya Islam" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "datashader>=0.19.1,<0.20",
    "pandas>=2.2",
]

[project.optional-dependencies]
data = [
    "pillow>=11",
    "pyarrow>=21",
]
test = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/SuMayaBee/datashader-browser"
Issues = "https://github.com/SuMayaBee/datashader-browser/issues"
Repository = "https://github.com/SuMayaBee/datashader-browser"

[tool.hatch.build.targets.wheel]
packages = ["src/datashader_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
