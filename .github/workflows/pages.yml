name: Build browser demo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-build.txt
      - name: Build JupyterLite site
        run: >-
          jupyter lite build
          --XeusAddon.environment_file=environment.yml
          --contents content
          --output-dir dist
      - name: Cache NYC Taxi data
        uses: actions/cache@v4
        with:
          path: .cache/data
          key: nyc-taxi-wide-v1
      - name: Download NYC Taxi data
        run: |
          mkdir -p .cache/data
          test -f .cache/data/nyc_taxi_wide.parq || curl -fL --retry 3 \
            -o .cache/data/nyc_taxi_wide.parq \
            https://datasets.holoviz.org/nyc_taxi/v1/nyc_taxi_wide.parq
      - name: Build NYC Taxi tile pyramid
        run: |
          pip install ".[data]"
          datashader-browser build-tiles .cache/data/nyc_taxi_wide.parq \
            --x pickup_x --y pickup_y \
            --x-range -8256000 -8209000 --y-range 4964000 4990000 \
            --max-level 8 --workers 4 --out dist/tiles/nyc-taxi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
